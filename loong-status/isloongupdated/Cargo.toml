[package]
name = "isloongupdated"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9.0"
dotenv = "0.15.0"
chrono = "0.4.38"
serde = { version = "1.0.210", features = ["derive"]}
sqlx = { version = "0.8.2", features = ["postgres", "runtime-tokio", "chrono"]}
tokio = { version = "1.40.0", features = ["full"] }
log = "0.4.27"

[dev-dependencies]
tempfile = "3.12.0"
